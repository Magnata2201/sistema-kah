<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Delícias da Kah</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { 
            margin: 0; padding: 0; 
            font-family: 'Poppins', sans-serif; 
            background: #fdf0ed; 
            background-image: radial-gradient(#f8d7da 1px, transparent 1px);
            background-size: 20px 20px;
            display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; 
        }
        .login-container { 
            background-color: #ffffff; 
            padding: 40px; 
            border-radius: 30px; 
            border: 2px solid #d4af37; 
            box-shadow: 0 10px 25px rgba(212, 175, 55, 0.2); 
            width: 100%; max-width: 400px; text-align: center; box-sizing: border-box; 
        }
        .logo-img { width: 220px; height: auto; margin-bottom: 20px; }
        h2 { 
            color: #8e6d31; 
            font-family: 'Playfair Display', serif; 
            font-size: 28px;
            margin-bottom: 25px; margin-top: 0; 
        }
        .input-group { margin-bottom: 15px; position: relative; }
        input { 
            width: 100%; padding: 14px; 
            border: 1px solid #eee; 
            border-radius: 15px;
            background-color: #fffaf0; 
            font-size: 14px; outline: none; box-sizing: border-box; color: #555;
            transition: 0.3s;
        }
        input:focus { border-color: #d4af37; box-shadow: 0 0 5px rgba(212, 175, 55, 0.3); }
        .forgot-password { display: block; text-align: center; color: #8e6d31; text-decoration: none; font-size: 12px; margin: 15px 0; font-style: italic; }
        .btn-login { 
            width: 100%; padding: 15px; 
            background: linear-gradient(135deg, #d4af37, #b08d57); 
            color: white; border: none; border-radius: 15px; 
            font-size: 16px; font-weight: 600; cursor: pointer; 
            box-shadow: 0 4px 15px rgba(184, 134, 11, 0.3); 
            text-transform: uppercase; letter-spacing: 1px;
            transition: 0.3s;
        }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(184, 134, 11, 0.4); }
        .signup-text { font-size: 13px; color: #999; margin-top: 20px; }
        .signup-text a { color: #d4af37; text-decoration: none; font-weight: bold; }
        .footer-support { margin-top: 40px; text-align: center; color: #8e6d31; font-size: 13px; }
        .footer-link { text-decoration: none; color: #8e6d31; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 8px; }
    </style>
</head>
<body>
    <div class="login-container">
        <img src="logo02.png" alt="Delícias da Kah Logo" class="logo-img">
        <h2>Entrar na Doçura</h2>
        <div class="input-group">
            <input type="text" id="username" placeholder="Usuário" autocomplete="off">
        </div>
        <div class="input-group">
            <input type="password" id="password" placeholder="Senha" autocomplete="off">
        </div>
        <a href="#" class="forgot-password"></a>
        <button class="btn-login" id="loginBtn">LOGAR</button>
        <p class="signup-text"> <a href="#"></a></p>
    </div>

    <div class="footer-support">
        <p></p>
        <a href="mailto:contato@deliciasdakah.com" class="footer-link">
            <i class="fa-regular fa-envelope"></i> contato@deliciasdakah.com
        </a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAEZx9VHKkYmUFfPILDw5PdoiJyH-O_Uf8",
            authDomain: "bando-da-kah.firebaseapp.com",
            projectId: "bando-da-kah",
            storageBucket: "bando-da-kah.firebasestorage.app",
            messagingSenderId: "25821048759",
            appId: "1:25821048759:web:6e55ca0c65245c92400232",
            measurementId: "G-MVTQ05YCD4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const loginBtn = document.getElementById('loginBtn');
        const userInp = document.getElementById('username');
        const passInp = document.getElementById('password');

        async function handleLogin() {
            const user = userInp.value;
            const pass = passInp.value;

            if (user === "admin" && pass === "1996") {
                window.location.href = "sistema.html";
                return;
            }

            try {
                const q = query(collection(db, "usuarios"), where("username", "==", user), where("password", "==", pass));
                const querySnapshot = await getDocs(q);
                if (!querySnapshot.empty) {
                    window.location.href = "sistema.html";
                } else {
                    alert("Usuário ou senha inválidos!");
                }
            } catch (error) {
                console.error("Erro ao logar:", error);
                alert("Erro na conexão com o banco de dados.");
            }
        }

        loginBtn.addEventListener('click', handleLogin);
        document.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleLogin(); });
    </script>
</body>
</html>
